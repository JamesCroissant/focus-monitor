name: Build and test

"on":
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev opencv-data

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      # ctest above only ever runs the pure-logic unit test executables --
      # main.cpp's own control flow (the actual order --help/--stats/the
      # display check/the cascade load/the camera open run in) has no
      # coverage of its own anywhere, since it's never been exercised by
      # calling the real binary. This CI runner is itself headless (no
      # DISPLAY/WAYLAND_DISPLAY) *and* has no camera, so a bare no-args
      # run would exit 1 either way (the display check or, failing that,
      # the camera-open check) -- checking the exit code alone can't tell
      # those apart, so this also greps stderr for the display check's
      # own message specifically, to confirm *that* check is what ran and
      # caught it, not that something merely failed for any reason.
      - name: Smoke-test the real binary's early exit paths
        working-directory: build
        run: |
          ./focus_monitor --help
          echo "--help exited 0 as expected"
          set +e
          output="$(./focus_monitor 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 1 ] || ! grep -q "no display available" <<< "$output"; then
            echo "Expected exit code 1 with a 'no display available' message, got status $status and:" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "no-display run exited 1 with the expected message"

      # --stats is the one other branch of main.cpp that, like --help and
      # the no-display case above, returns before ever touching a camera
      # or a display -- but unlike those two, it had no coverage here at
      # all. ReadSessionLogStats() itself (the aggregation logic) is
      # already unit-tested in tests/test_session_logger.cpp, but main.cpp's
      # own use of it -- the "No session log found" error path, and the
      # exact three lines of formatted output README.md documents -- was
      # never exercised through the real binary either way.
      - name: Smoke-test the real binary's --stats path
        working-directory: build
        run: |
          set +e
          output="$(./focus_monitor --stats --session-log /tmp/focus_monitor_ci_missing_log.csv 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 1 ] || ! grep -q "No session log found" <<< "$output"; then
            echo "Expected exit code 1 with a 'No session log found' message for a missing log, got status $status and:" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "--stats with no log file exited 1 with the expected message"

          log_path="$(mktemp /tmp/focus_monitor_ci_stats_log.XXXXXX.csv)"
          cat > "$log_path" <<'CSV'
ended_at,duration_seconds,focus_percent
2026-01-01T00:00:00Z,100.0,50.0
2026-01-01T01:00:00Z,300.0,90.0
CSV
          expected="Sessions recorded: 2
Total tracked time: 400s
Average focus rate: 80.0%"
          output="$(./focus_monitor --stats --session-log "$log_path")"
          status=$?
          rm -f "$log_path"
          if [ "$status" -ne 0 ] || [ "$output" != "$expected" ]; then
            echo "Expected exit code 0 with the duration-weighted summary below, got status $status and:" >&2
            echo "$output" >&2
            echo "--- expected ---" >&2
            echo "$expected" >&2
            exit 1
          fi
          echo "--stats with a real log file printed the expected summary"
